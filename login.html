<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIVA ERP - Employee Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f3f4f6;
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --error-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #e0e7ff 0%, #ede9fe 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05), 0 20px 48px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .logo-container {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-container h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .logo-container p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      font-family: 'Inter', sans-serif;
      margin-top: 1rem;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .error-msg {
      color: var(--error-color);
      font-size: 0.85rem;
      margin-top: 0.5rem;
      text-align: center;
      display: none;
    }

    .loading-spinner {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo-container">
      <h1>AIVA ERP</h1>
      <p>Employee Portal Login</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="name@aiva.com" required autocomplete="email">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div id="errorMsg" class="error-msg">Invalid email or password.</div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText">Sign In</span>
        <div id="loadingSpinner" class="loading-spinner"></div>
      </button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const loadingSpinner = document.getElementById('loadingSpinner');

      // Reset state
      errorMsg.style.display = 'none';
      btnText.style.display = 'none';
      loadingSpinner.style.display = 'inline-block';
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/v2/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          // Save token and user info
          localStorage.setItem('erpToken', data.token);
          localStorage.setItem('erpUser', JSON.stringify(data.user));
          
          // Redirect based on role
          if (data.user.role === 'Super Admin' || data.user.role === 'Owner') {
            window.location.href = '/admin-dashboard.html';
          } else {
            window.location.href = '/employee-dashboard.html';
          }
        } else {
          errorMsg.textContent = data.msg || 'Login failed';
          errorMsg.style.display = 'block';
        }
      } catch (error) {
        console.error('Login error:', error);
        errorMsg.textContent = 'Network error. Please try again later.';
        errorMsg.style.display = 'block';
      } finally {
        btnText.style.display = 'inline';
        loadingSpinner.style.display = 'none';
        submitBtn.disabled = false;
      }
    });

    // Check if already logged in
    window.onload = () => {
      const token = localStorage.getItem('erpToken');
      const userStr = localStorage.getItem('erpUser');
      if (token && userStr) {
        try {
          const user = JSON.parse(userStr);
          if (user.role === 'Super Admin' || user.role === 'Owner') {
            window.location.href = '/admin-dashboard.html';
          } else {
            window.location.href = '/employee-dashboard.html';
          }
        } catch (e) {
          // Invalid user data, clear and stay on login
          localStorage.removeItem('erpToken');
          localStorage.removeItem('erpUser');
        }
      }
    };
  </script>
</body>
</html>
